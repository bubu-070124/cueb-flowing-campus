<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>流动的校园 · 由我们构成</title>
  <style>
    :root{--red:#a80f1c;--paper:#f3eddf;--ink:#382e2c}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#fff;background:#8f0a16}button,input{font:inherit}
    .backdrop{position:fixed;inset:0;background:radial-gradient(circle at 68% 28%,#ce3942 0,#a80f1c 36%,#860914 68%,#5b050d 100%)}
    .backdrop:before{content:"";position:absolute;inset:-15%;opacity:.12;background:linear-gradient(90deg,transparent 49.7%,#fff 50%,transparent 50.3%) 0 0/12vw 100%,linear-gradient(transparent 72%,#fff 73%,transparent 74%) 0 0/100% 15vh;transform:perspective(750px) rotateX(8deg)}
    .backdrop:after{content:"";position:absolute;width:54vw;height:54vw;right:-15vw;top:-24vw;border:clamp(34px,7vw,130px) solid #fff;border-radius:50%;opacity:.055;box-shadow:0 0 0 1px #fff,0 0 0 clamp(52px,10vw,180px) #fff1}
    header{position:fixed;z-index:5;left:clamp(22px,4vw,70px);top:clamp(18px,4vh,52px);display:flex;align-items:center;gap:14px;pointer-events:none}.seal{width:42px;height:42px;border:1px solid #fff9;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--red);box-shadow:0 0 0 4px #fff2;font:700 9px Georgia;letter-spacing:.05em}.eyebrow{margin:0 0 5px;font-size:9px;letter-spacing:.25em;opacity:.62}.title{font-size:clamp(17px,1.5vw,26px);font-weight:400;letter-spacing:.13em;margin:0}.counter{position:fixed;z-index:5;right:clamp(22px,4vw,70px);top:clamp(28px,5vh,63px);font-size:10px;letter-spacing:.16em;color:#fff9}
    #wall-viewport{position:fixed;z-index:2;inset:11vh 0 7vh;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);touch-action:none;cursor:grab}#wall-viewport.dragging{cursor:grabbing}#photo-track{height:100%;display:flex;width:max-content;will-change:transform}.wall-section{position:relative;flex:0 0 3000px;height:100%}
    .polaroid{position:absolute;left:var(--x);top:var(--y);z-index:var(--z);width:var(--w);height:var(--h);padding:12px 12px 52px;border:0;background:var(--paper);color:var(--ink);box-shadow:0 22px 55px #30030e70,0 2px 1px #fff inset;transform:rotate(var(--tilt)) scale(var(--scale,1));cursor:pointer;text-align:left;transition:filter .3s,box-shadow .3s,transform .3s;overflow:hidden}.polaroid:hover,.polaroid:focus-visible{z-index:10;filter:brightness(1.04);box-shadow:0 28px 72px #250209a6,0 0 0 2px #fff8;transform:rotate(0deg) scale(calc(var(--scale,1) + .025));outline:0}.polaroid.is-back{filter:saturate(.78) brightness(.88);opacity:.8}.polaroid.is-back:hover{filter:none;opacity:1}
    .frame{height:100%;overflow:hidden;background:#d8cbbf;position:relative}.frame:after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,#fff2,transparent 38%,#5d061518);pointer-events:none}.frame img,.photo-placeholder,.demo-photo{display:block;width:100%;height:100%;object-fit:cover}.meta{position:absolute;left:15px;right:12px;bottom:10px}.meta b{display:block;font:500 13px Georgia,"Microsoft YaHei";letter-spacing:.09em}.meta span{display:block;margin-top:5px;font-size:9px;letter-spacing:.07em;color:#7c706b}.tag{position:absolute;z-index:2;right:18px;top:18px;padding:5px 8px;border-radius:999px;background:#6d0714d9;color:#fff;font-size:8px;letter-spacing:.09em}.photo-placeholder{display:grid;place-items:center;background:linear-gradient(145deg,#d8cec4,#eee7da);color:#776a64;font-size:12px;letter-spacing:.13em}.blank-card .frame{display:grid;place-items:center;border:1px solid #b7aaa0;background:radial-gradient(circle,#fff 0 1px,transparent 2px) 0 0/18px 18px,#eee6da}.blank-card .plus{width:68px;height:68px;margin:auto;border:1px solid #9d8e85;border-radius:50%;display:grid;place-items:center;font:200 32px Georgia;color:#8e7d75}.blank-card .invite{text-align:center;margin-top:15px;font-size:11px;line-height:1.8;color:#74655f}.demo-photo{position:relative;background:radial-gradient(circle at 50% 35%,#f5d6c7 0 7%,transparent 7.5%),radial-gradient(ellipse at 50% 70%,#c27675 0 21%,transparent 21.5%),radial-gradient(circle,#fff7 0 1px,transparent 2px) 0 0/13px 13px,#803246}.wall-hint{position:fixed;z-index:5;left:50%;bottom:2.7vh;transform:translateX(-50%);font-size:10px;letter-spacing:.17em;color:#f7e9e1a8;white-space:nowrap}.wall-hint:before{content:"";display:inline-block;width:40px;height:1px;margin-right:12px;background:#fff7;vertical-align:middle}
    #memory-stage{position:fixed;z-index:20;inset:0;background:#030406;opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .38s,transform .38s,visibility 0s .38s}#memory-stage.active{opacity:1;visibility:visible;transform:none;transition-delay:0s}#memory-frame{width:100%;height:100%;border:0;background:#030406}.memory-close{position:absolute;z-index:3;right:clamp(18px,3vw,42px);top:clamp(18px,3vw,36px);width:48px;height:48px;border:1px solid #ffffff70;border-radius:50%;background:#1d0309ad;color:#fff;font-size:25px;line-height:1;cursor:pointer;backdrop-filter:blur(8px)}.memory-close:hover{background:#8f0a16}.memory-loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:-1;font-size:10px;letter-spacing:.2em;color:#fff7}
    dialog{width:min(680px,92vw);border:1px solid #fff4;border-radius:22px;padding:0;background:#f1eadf;color:#39292a;box-shadow:0 32px 110px #160106cc}dialog::backdrop{background:#22040de8;backdrop-filter:blur(5px)}.capture{display:grid;grid-template-columns:1.15fr .85fr;min-height:420px}.capture-view{position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#c96d79,#781528 60%,#3e0913)}.capture-view:before{content:"";position:absolute;z-index:2;inset:0;background:radial-gradient(circle,#fff9 0 1px,transparent 2px) 0 0/15px 15px;opacity:.12;pointer-events:none}.capture-view video,.capture-view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.capture-view video{transform:scaleX(-1)}.camera-placeholder{position:relative;z-index:1;width:72%;font-size:11px;line-height:1.8;letter-spacing:.08em;text-align:center;color:#f7eae3cc}.countdown{position:absolute;z-index:3;font:300 110px Georgia;color:#fff;text-shadow:0 8px 30px #340510;display:none}.capture-side{padding:34px 30px;display:flex;flex-direction:column}.capture-side h2{font:400 22px Georgia,"Microsoft YaHei";letter-spacing:.08em;margin:0 0 12px}.capture-side p{font-size:12px;line-height:1.8;color:#746463}.privacy{margin:12px 0;padding:11px;border-left:2px solid var(--red);background:#a6192e0d;font-size:10px;line-height:1.7;color:#78696a}.caption-step{display:none}.caption-step label{display:block;font-size:11px;margin:16px 0 7px}.caption-step input{width:100%;border:0;border-bottom:1px solid #8b7d75;background:transparent;padding:9px 2px;outline:0;color:#39292a}.capture-actions{display:flex;gap:9px;margin-top:auto}.capture-actions button{flex:1;border:1px solid #a7978e;background:transparent;padding:10px;border-radius:999px;color:#4c3c3c;cursor:pointer}.capture-actions button:disabled{opacity:.5;cursor:wait}.capture-actions .primary{background:var(--red);border-color:var(--red);color:#fff}.toast{position:fixed;z-index:30;left:50%;bottom:5vh;transform:translate(-50%,20px);padding:10px 18px;border-radius:999px;background:#f2eadf;color:#4d3638;font-size:11px;opacity:0;pointer-events:none;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:700px){.counter{display:none}.polaroid{transform:rotate(var(--tilt)) scale(.82);transform-origin:top left}.capture{grid-template-columns:1fr}.capture-view{min-height:250px}.capture-side{padding:22px}}@media(prefers-reduced-motion:reduce){#photo-track{will-change:auto}}
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <header><div class="seal">CUEB</div><div><p class="eyebrow">FLOWING CAMPUS ARCHIVE</p><h1 class="title">流动的校园 · 由我们构成</h1></div></header>
  <div class="counter">23 个真实场景 · 校园记忆实验</div>
  <main id="wall-viewport" aria-label="流动的校园照片墙"><div id="photo-track"></div></main>
  <div class="wall-hint">轻触照片唤醒记忆 · 向左拖动加速时间河</div>
  <section id="memory-stage" aria-hidden="true"><div class="memory-loading">正在唤醒这一帧记忆</div><iframe id="memory-frame" title="校园粒子回忆"></iframe><button class="memory-close" id="memory-close" aria-label="返回照片墙">×</button></section>
  <dialog id="capture-panel"><section class="capture"><div class="capture-view"><video id="camera-preview" autoplay muted playsinline></video><canvas id="camera-particle-preview"></canvas><div class="camera-placeholder" id="camera-placeholder" role="status">点击右侧按钮开启摄像头<br>准备好后再拍摄</div><div class="countdown" id="countdown">3</div></div><div class="capture-side"><div id="shoot-step"><h2>留下你的瞬间</h2><p>和朋友摆一个姿势，让此刻成为校园时间河里新的一帧。</p><div class="privacy">摄像头只在你点击后开启。公开的是低分辨率粒子姿态与一句话；原始画面生成后立即从页面内存中清除。</div></div><div class="caption-step" id="caption-step"><h2>写下此刻</h2><p>不留姓名，只留一句校园记忆。</p><label for="caption-input">15 个汉字以内</label><input id="caption-input" maxlength="15" placeholder="我们刚好都在这里"></div><div class="capture-actions"><button id="capture-cancel">取消</button><button class="primary" id="capture-primary">开启摄像头</button></div></div></section></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="./wall.js?v=20260919-1" defer></script><script src="./particles.js?v=20260919-1" defer></script><script src="./capture.js?v=20260919-1" defer></script><script src="./main.js?v=20260919-1" defer></script>
</body>
</html>
