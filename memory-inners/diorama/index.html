    *{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(#8fb6cf 0 44%,#d9cfba 72%,#63574c);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#fff}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}canvas:active{cursor:grabbing}.wash{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,#10223116,transparent 45%,#160b0757 100%)}.copy{position:fixed;z-index:2;left:clamp(22px,4vw,54px);top:clamp(22px,4vw,48px);pointer-events:none}.eyebrow{font:500 9px/1.2 Georgia,serif;letter-spacing:.28em;color:#fff0cbd9}.copy h1{margin-top:9px;font:300 clamp(17px,2vw,25px)/1.3 Georgia,"Microsoft YaHei";letter-spacing:.16em;text-shadow:0 4px 20px #102535}.copy p{margin-top:8px;font-size:10px;letter-spacing:.14em;color:#ffffffe0;text-shadow:0 2px 12px #183040}.badge{position:fixed;z-index:2;right:clamp(22px,4vw,54px);top:clamp(22px,4vw,48px);padding:7px 11px;border:1px solid #fff8;border-radius:999px;background:#6d1020b8;font-size:9px;letter-spacing:.15em;color:#fff;backdrop-filter:blur(8px)}.controls{position:fixed;z-index:3;left:50%;bottom:clamp(20px,4vh,42px);transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px;border:1px solid #fff6;border-radius:999px;background:#2d1e1ab8;box-shadow:0 10px 35px #2e160d55;backdrop-filter:blur(12px)}.controls span{padding:0 8px;font-size:10px;letter-spacing:.12em;color:#fff;white-space:nowrap}.controls button{border:1px solid #fff5;border-radius:999px;padding:8px 13px;background:#a80f1ce8;color:#fff;font:500 10px/1 "Microsoft YaHei";letter-spacing:.1em;cursor:pointer}.loading{position:fixed;z-index:4;inset:0;display:grid;place-items:center;background:#8fb6cf;color:#fff;font-size:10px;letter-spacing:.2em}.loading.done{display:none}@media(max-width:640px){.copy p{display:none}.badge{top:auto;right:auto;left:22px;bottom:76px}.controls span{display:none}}

  <style>
